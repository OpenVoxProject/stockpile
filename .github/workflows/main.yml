---
name: main

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read # minimal permissions that we have to grant

jobs:
  lein-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java:
          - 25
          - 21
          - 17
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - name: Install Clojure tools
        uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: latest              # Clojure CLI based on tools.deps
          lein: latest                  # Leiningen
          boot: latest                  # Boot.clj
          bb: latest                    # Babashka
          clj-kondo: latest        # Clj-kondo
          cljstyle: latest             # cljstyle
          zprint: latest                # zprint
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: apt-${{ matrix.java }}
          path: |
            ~/.m2/repository
            /var/cache/apt/archives/*.deb
      - name: lein test (jdk ${{ matrix.java }})
        run: dev/java-env --expect-major ${{ matrix.java }} "${JAVA_HOME_${{ matrix.java }}_X64}" dev/run-test --use-sudo

  tests:
    if: always()
    needs:
      - lein-test
    runs-on: ubuntu-24.04
    name: Test suite
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
